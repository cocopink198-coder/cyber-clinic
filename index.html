<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>賽博紓壓診所：沉浸式壓力解碼器</title>
<style>
:root {
    --bg-color: #e3f2fd; --card-bg: #ffffff; --primary-color: #1e88e5;
    --primary-hover: #1565c0; --text-main: #263238; --text-muted: #546e7a;
    --border-radius: 20px; --pos-color: #2e7d32; --neg-color: #d32f2f;
}
@media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
        --bg-color: #121212; --card-bg: #1e1e1e; --primary-color: #64b5f6;
        --primary-hover: #42a5f5; --text-main: #e0e0e0; --text-muted: #9e9e9e;
        --pos-color: #66bb6a; --neg-color: #ef5350;
    }
}
:root[data-theme="dark"] {
    --bg-color: #121212; --card-bg: #1e1e1e; --primary-color: #64b5f6;
    --primary-hover: #42a5f5; --text-main: #e0e0e0; --text-muted: #9e9e9e;
    --pos-color: #66bb6a; --neg-color: #ef5350;
}
* { box-sizing: border-box; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
    font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
    background: var(--bg-color); color: var(--text-main); margin: 0;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; min-height: 100dvh; /* 手機網址列會伸縮，dvh 會跟著變 */
    overflow-x: hidden; transition: background 0.3s, color 0.3s;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
/* 只管點擊，不等雙擊縮放判斷；拿掉手機點擊時的灰色閃光 */
button, .avatar-option, .option-btn, .platform-btn {
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}
.container { width: 100%; max-width: 600px; padding: 20px; position: relative; z-index: 10; }
.card {
    background-color: var(--card-bg); border-radius: var(--border-radius);
    box-shadow: 0 12px 30px rgba(0,0,0,0.15); padding: 30px; text-align: center;
    transition: background-color 0.3s; position: relative; z-index: 10;
}
.top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-size: 0.85rem; color: var(--text-muted); gap: 8px; flex-wrap: wrap; }
h1 { font-size: 1.5rem; color: var(--primary-color); margin-bottom: 10px; }
h4 { color: var(--text-main); text-align: left; margin: 25px 0 10px; font-size: 1rem; }
p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 20px; }
.config-section { background: var(--bg-color); padding: 15px; border-radius: 12px; margin-bottom: 20px; text-align: left; font-size: 0.85rem; }
.config-section label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--text-main); }
.config-section input { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ccc; margin-bottom: 12px; font-size: 0.9rem; background: var(--card-bg); color: var(--text-main); }
.avatar-grid { display: flex; gap: 10px; justify-content: center; margin-bottom: 12px; }
.avatar-option { font-size: 1.8rem; cursor: pointer; padding: 5px; border-radius: 50%; border: 2px solid transparent; transition: 0.2s; }
.avatar-option.selected { border-color: var(--primary-color); background-color: var(--bg-color); transform: scale(1.1); }
.breathe-circle {
    width: 120px; height: 120px; background-color: #90caf9; border-radius: 50%; margin: 30px auto;
    display: flex; justify-content: center; align-items: center; color: white; font-weight: bold;
    text-align: center; padding: 6px;
    animation: breatheAnimation 4s infinite ease-in-out;
}
@keyframes breatheAnimation { 0% { transform: scale(1); background-color: #90caf9; } 50% { transform: scale(1.3); background-color: #42a5f5; } 100% { transform: scale(1.0); background-color: #90caf9; } }
.progress { font-size: 0.85rem; color: var(--primary-color); font-weight: bold; margin-bottom: 15px; display: block; text-transform: uppercase; }
.option-btn { background-color: var(--bg-color); border: 2px solid transparent; border-radius: 14px; padding: 14px; width: 100%; margin-bottom: 12px; text-align: left; cursor: pointer; transition: all 0.2s; font-size: 0.95rem; color: var(--text-main); }
.option-btn:hover { border-color: var(--primary-color); transform: scale(1.02); }
.draw-btn { background-color: #d32f2f; color: white; border: none; border-radius: 50px; padding: 15px 40px; font-size: 1.2rem; cursor: pointer; transition: 0.2s; font-weight: bold; box-shadow: 0 4px 15px rgba(211,47,47,0.4); width: 100%; margin-top: 10px; }
.draw-btn:hover { background-color: #b71c1c; transform: translateY(-2px); }
#draw-result { margin-top: 15px; font-size: 1.05rem; font-weight: bold; color: var(--neg-color); min-height: 30px; white-space: pre-line; }
.rage-target { position: fixed; background: #ff5252; color: white; padding: 6px 12px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.2); animation: floatRandom 8s forwards linear; user-select: none; transition: transform 0.1s, opacity 0.2s; }
.rage-target:hover { transform: scale(1.1); background: #ff1744; }
@keyframes floatRandom { 0% { transform: translateY(105vh) translateX(0); opacity: 0.9; } 100% { transform: translateY(-10vh) translateX(30px); opacity: 0; } }
.btn { background-color: var(--primary-color); color: white; border: none; border-radius: 50px; padding: 12px 30px; font-size: 1rem; cursor: pointer; width: 100%; margin-top: 10px; transition: background 0.2s, transform 0.1s; }
.btn:hover { background-color: var(--primary-hover); transform: translateY(-2px); }
.btn:active { transform: scale(0.95); }
.ghost { background-color: #90a4ae; font-size: 0.85rem; padding: 9px; }
.ghost:hover { background-color: #78909c; }
.hidden { display: none !important; }
.diagnosis-box {
    background: var(--bg-color); border-radius: 14px; padding: 16px; margin: 15px 0;
    font-size: 1rem; font-weight: bold; color: var(--primary-color);
    opacity: 0; transform: translateY(10px);
    transition: opacity 0.6s ease, transform 0.6s ease;
}
.diagnosis-box.show { opacity: 1; transform: translateY(0); }
.prescription-box {
    background: var(--card-bg); border: 2px dashed var(--primary-color); border-radius: 12px;
    padding: 16px; margin-top: 15px; text-align: left;
    opacity: 0; transform: translateY(10px);
    transition: opacity 0.6s ease, transform 0.6s ease;
}
.prescription-box.show { opacity: 1; transform: translateY(0); }
.prescription-box h3 { margin: 0 0 8px 0; color: var(--neg-color); font-size: 1rem; }
.prescription-box p { margin: 0; color: var(--text-main); font-size: 0.9rem; line-height: 1.5; }
#radarChart { width: 100%; max-width: 480px; height: auto; display: block; margin: 10px auto; }

.result-label { color: var(--text-muted); font-size: 0.95rem; margin: 20px 0 0; }
.result-score { font-size: 3rem; font-weight: bold; color: var(--primary-color); margin: 5px 0 10px; }
.battery { width: 100%; height: 26px; border: 3px solid var(--text-main); border-radius: 10px; background: var(--bg-color); overflow: hidden; margin-bottom: 15px; }
.battery-fill { height: 100%; width: 0; transition: width 1s ease, background-color 1s ease; }
.status { background: var(--bg-color); border-radius: 14px; padding: 14px; font-weight: bold; color: var(--primary-color); margin-bottom: 15px; }
.calc { text-align: left; background: var(--card-bg); border: 2px dashed var(--primary-color); border-radius: 12px; padding: 12px 14px; font-size: 0.85rem; color: var(--text-main); line-height: 1.8; margin-bottom: 15px; }
.calc .row { display: flex; justify-content: space-between; gap: 10px; }
.calc .sum { border-top: 1px dashed var(--primary-color); margin-top: 6px; padding-top: 6px; font-weight: bold; }

.dim-section { text-align: left; margin: 20px 0 5px; }
.dim-section h3 { font-size: 1rem; color: var(--text-main); margin: 0 0 10px; }
.dim-row { margin-bottom: 14px; }
.dim-head { display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-main); margin-bottom: 4px; }
.dim-head .raw { color: var(--text-muted); font-size: 0.75rem; }
.dim-head .score { font-weight: bold; color: var(--primary-color); }
.dim-track { height: 14px; background: var(--bg-color); border-radius: 7px; overflow: hidden; }
.dim-fill { height: 100%; width: 0; border-radius: 7px; background: linear-gradient(90deg, #64b5f6, #1e88e5); transition: width 0.8s ease; }

#history-list { list-style: none; padding: 0; margin: 0; text-align: left; }
#history-list li {
    background: var(--card-bg); border: 2px dashed var(--primary-color); border-radius: 12px;
    padding: 12px 14px; margin-bottom: 10px; font-size: 0.85rem; color: var(--text-main); line-height: 1.6;
}
#history-list .time { color: var(--text-muted); font-size: 0.8rem; }
#history-list .drain { color: var(--neg-color); font-weight: bold; }
.empty { color: var(--text-muted); font-size: 0.9rem; text-align: center; padding: 10px; }

.lang-switch { display: flex; gap: 6px; justify-content: center; margin-bottom: 12px; }
.lang-btn { background-color: var(--card-bg); border: 2px solid transparent; border-radius: 50px; padding: 6px 14px; font-size: 0.8rem; cursor: pointer; color: var(--text-main); transition: 0.2s; }
.lang-btn:hover { border-color: var(--primary-color); }
.lang-btn.active { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }

.monitor { background: #000; border: 2px solid #238636; border-radius: 10px; overflow: hidden; margin-bottom: 15px; }
#ecg { display: block; width: 100%; height: 110px; }
.ecg-stats { display: flex; justify-content: space-between; font-size: 0.8rem; color: #4ade80; margin-bottom: 15px; padding: 0 4px; }

/* ---------- 惡搞病歷戳章 ---------- */
.stamp-stage {
    position: relative;
    height: 0;
    perspective: 600px;
    z-index: 20;
}
.stamp {
    position: absolute;
    top: -110px;
    right: 10px;
    width: 110px;
    height: 110px;
    border: 6px solid #d32f2f;
    border-radius: 50%;
    color: #d32f2f;
    font-weight: bold;
    font-size: 0.85rem;
    white-space: pre-line;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    transform-style: preserve-3d;
    opacity: 0;
    pointer-events: none;
    transform: translateZ(-300px) rotateX(40deg) rotate(-15deg);
}
.stamp.drop {
    animation: stampFall 0.7s cubic-bezier(0.3, 0.6, 0.3, 1) forwards;
}
@keyframes stampFall {
    0% {
        opacity: 0;
        transform: translateZ(-300px) rotateX(40deg) rotate(-15deg);
    }
    55% {
        opacity: 1;
        transform: translateZ(0) rotateX(0deg) rotate(8deg) scale(1.15);
    }
    75% {
        transform: translateZ(0) rotateX(0deg) rotate(-5deg) scale(0.95);
    }
    100% {
        opacity: 1;
        transform: translateZ(0) rotateX(0deg) rotate(-8deg) scale(1);
    }
}
.stamp::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    box-shadow:
        inset 0 0 0 2px rgba(211, 47, 47, 0.3),
        inset 4px 4px 8px rgba(255,255,255,0.4),
        inset -4px -4px 8px rgba(211,47,47,0.15);
    pointer-events: none;
}

/* ---------- 匿名發洩牆 ---------- */
.wall-btn { background-color: #7e57c2; }
.wall-btn:hover { background-color: #673ab7; }
.health-btn { background-color: #00897b; }
.health-btn:hover { background-color: #00695c; }
.mode-switch { display: flex; gap: 8px; margin-bottom: 16px; }
.mode-btn {
    flex: 1; background-color: var(--bg-color); border: 2px solid transparent; border-radius: 50px;
    padding: 8px; font-size: 0.85rem; cursor: pointer; color: var(--text-main); transition: 0.2s;
}
.mode-btn.active { background-color: var(--primary-color); color: white; border-color: var(--primary-color); }
.input-row { display: flex; gap: 8px; margin-bottom: 16px; }
.input-row input {
    flex: 1; min-width: 0; padding: 10px 14px; border-radius: 50px; border: 2px solid var(--bg-color);
    font-size: 0.9rem; background: var(--card-bg); color: var(--text-main);
}
.input-row input:focus { outline: none; border-color: var(--primary-color); }
.send-btn {
    background-color: var(--primary-color); color: white; border: none; border-radius: 50px;
    padding: 10px 20px; font-size: 0.9rem; cursor: pointer; white-space: nowrap;
}
.send-btn:hover { background-color: var(--primary-hover); }
#wallView { max-height: 280px; overflow-y: auto; text-align: left; }
.complaint-card {
    background: var(--card-bg); border: 2px dashed var(--primary-color); border-radius: 12px;
    padding: 10px 14px; margin-bottom: 8px; font-size: 0.88rem; color: var(--text-main); word-break: break-word;
}
#bubbleView { position: relative; height: 280px; background: #0d1117; border-radius: 12px; overflow: hidden; }
.bubble {
    position: absolute; bottom: -40px; background: #ff5252; color: white; padding: 6px 14px;
    border-radius: 20px; font-size: 0.8rem; max-width: 80%; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis; animation: floatUp linear forwards;
}
@keyframes floatUp {
    0% { transform: translateY(0); opacity: 0.9; }
    100% { transform: translateY(-320px); opacity: 0; }
}

/* ---------- 出院通知書（分享） ---------- */
.share-section { text-align: left; margin: 20px 0 5px; }
.share-section h3 { font-size: 1rem; color: var(--text-main); margin: 0 0 4px; }
.share-hint { color: var(--text-muted); font-size: 0.8rem; margin: 0 0 12px; }
.platform-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.platform-btn {
    background-color: var(--bg-color); border: 2px solid transparent; border-radius: 12px; padding: 12px;
    font-size: 0.9rem; cursor: pointer; color: var(--text-main); text-align: left; transition: 0.2s;
}
.platform-btn:hover { border-color: var(--primary-color); }
.platform-btn .tone { display: block; font-size: 0.7rem; color: var(--text-muted); margin-top: 2px; }
.preview-box {
    background: var(--card-bg); border: 2px dashed var(--primary-color); border-radius: 12px; padding: 14px;
    font-size: 0.85rem; color: var(--text-main); white-space: pre-line; min-height: 60px; margin-bottom: 8px;
    word-break: break-word;
}
.toast { text-align: center; font-size: 0.8rem; color: var(--pos-color); min-height: 20px; }

/* ---------- 院內自主健檢 ---------- */
.sheet { border: 2px dashed var(--primary-color); border-radius: 14px; padding: 14px; margin-bottom: 14px; text-align: left; }
.sheet h3 { margin: 0 0 8px; font-size: 1rem; color: var(--text-main); }
.hc-row {
    display: flex; justify-content: space-between; gap: 10px; font-size: 0.85rem; padding: 5px 0;
    border-bottom: 1px dashed var(--text-muted); color: var(--text-main);
}
.hc-row:last-child { border-bottom: none; }
.ok { color: var(--pos-color); font-weight: bold; }
.bad { color: var(--neg-color); font-weight: bold; }
#benchBox { display: flex; flex-wrap: wrap; gap: 2px; height: 40px; overflow: hidden; margin-top: 8px; }
.dot { width: 8px; height: 8px; background: #90caf9; border-radius: 2px; }
.pulse-track { height: 10px; background: var(--bg-color); border-radius: 5px; overflow: hidden; margin-top: 10px; }
.pulse-bar { height: 100%; width: 30%; background: var(--primary-color); border-radius: 5px; }
.pulse-status { font-size: 0.75rem; color: var(--text-muted); margin-top: 4px; text-align: left; }

/* 系統設定為「減少動態」時，停掉會動的裝飾 */
@media (prefers-reduced-motion: reduce) {
    .breathe-circle { animation: none; }
    .rage-target { display: none; }
    .stamp.drop { animation: none; opacity: 1; transform: rotate(-8deg); }
    .pulse-bar { display: none; }
    .battery-fill, .dim-fill { transition: none; }
}
</style>
</head>
<body>
<div class="container">

    <div class="lang-switch" id="lang-switch">
        <button class="lang-btn" data-lang="zh">中文</button>
        <button class="lang-btn" data-lang="en">EN</button>
        <button class="lang-btn" data-lang="ja">日本語</button>
        <button class="lang-btn" data-lang="ko">한국어</button>
    </div>

    <div id="welcome-screen" class="card">
        <div class="top-bar">
            <span data-i18n="topTag"></span>
            <button onclick="toggleTheme(); playClickSound();" id="theme-btn" style="padding:4px 10px;border-radius:6px;cursor:pointer;background:var(--bg-color);color:var(--text-main);border:1px solid #ccc;"></button>
        </div>
        <h1 data-i18n="title"></h1>
        <p data-i18n="subtitle"></p>
        <div class="config-section">
            <label data-i18n="avatarLabel"></label>
            <div class="avatar-grid">
                <div class="avatar-option selected" onclick="selectAvatar('🐱', this); playClickSound();">🐱</div>
                <div class="avatar-option" onclick="selectAvatar('🐶', this); playClickSound();">🐶</div>
                <div class="avatar-option" onclick="selectAvatar('🦊', this); playClickSound();">🦊</div>
                <div class="avatar-option" onclick="selectAvatar('🐼', this); playClickSound();">🐼</div>
                <div class="avatar-option" onclick="selectAvatar('🦄', this); playClickSound();">🦄</div>
            </div>
            <label for="user-email" data-i18n="emailLabel"></label>
            <input type="email" id="user-email" placeholder="example@email.com">
        </div>
        <button class="btn" data-i18n="enterBtn" onclick="goToBreathe()"></button>
        <button class="btn wall-btn" data-i18n="wallOpenBtn" onclick="playClickSound(); openWall('welcome-screen')"></button>
        <button class="btn health-btn" data-i18n="healthOpenBtn" onclick="playClickSound(); openHealth()"></button>
        <h4 data-i18n="historyTitle"></h4>
        <ul id="history-list"></ul>
        <button class="btn ghost" data-i18n="clearBtn" onclick="clearHistory()"></button>
    </div>

    <div id="breathe-screen" class="card hidden">
        <h2 data-i18n="breatheTitle"></h2>
        <p data-i18n="breatheDesc"></p>
        <div id="user-avatar-display" style="font-size:2.5rem;margin:10px 0;">🐱</div>
        <div class="breathe-circle" id="breathe-text"></div>
        <button class="btn" data-i18n="readyBtn" onclick="startQuizFlow()"></button>
    </div>

    <div id="quiz-screen" class="card hidden">
        <div class="monitor">
            <canvas id="ecg" width="500" height="110"></canvas>
        </div>
        <div class="ecg-stats">
            <span id="bpm-display">60 bpm</span>
            <span id="progress-text" class="progress" style="margin:0;color:#4ade80;">Question 1 of 5</span>
        </div>
        <h2 id="question-text">題目載入中...</h2>
        <div id="options-container"></div>
        <div id="draw-result"></div>
    </div>

    <div id="result-screen" class="card hidden">
        <h1 data-i18n="resultTitle"></h1>
        <canvas id="radarChart" width="600" height="600"></canvas>
        <div class="diagnosis-box" id="diagnosis-text">正在分析你的腦內波長……</div>
        <div class="prescription-box" id="prescription-container"></div>

        <div class="stamp-stage">
            <div class="stamp" id="stamp" data-i18n="stampText"></div>
        </div>

        <div class="dim-section">
            <h3 data-i18n="dimTitle"></h3>
            <div id="dim-container"></div>
            <div class="calc" id="dim-calc"></div>
        </div>

        <p class="result-label" data-i18n="drainLabel"></p>
        <div class="result-score" id="score-display">0%</div>
        <div class="battery"><div class="battery-fill" id="fill"></div></div>
        <div class="status" id="status"></div>
        <div class="calc" id="calc"></div>

        <div class="share-section">
            <h3 data-i18n="shareTitle"></h3>
            <p class="share-hint" data-i18n="shareHint"></p>
            <div class="platform-grid">
                <button class="platform-btn" onclick="share('ig')">Instagram<span class="tone" data-i18n="toneIg"></span></button>
                <button class="platform-btn" onclick="share('threads')">Threads<span class="tone" data-i18n="toneThreads"></span></button>
                <button class="platform-btn" onclick="share('line')">LINE<span class="tone" data-i18n="toneLine"></span></button>
                <button class="platform-btn" onclick="share('fb')">Facebook<span class="tone" data-i18n="toneFb"></span></button>
            </div>
            <div class="preview-box" id="share-preview"></div>
            <div class="toast" id="share-toast"></div>
        </div>

        <button class="btn wall-btn" data-i18n="wallOpenBtn" onclick="playClickSound(); openWall('result-screen')"></button>
        <button class="btn" data-i18n="restartBtn" onclick="restartTest()"></button>
    </div>

    <div id="wall-screen" class="card hidden">
        <h2 data-i18n="wallTitle"></h2>

        <div class="mode-switch">
            <button class="mode-btn active" data-mode="list" onclick="switchWallMode('list')" data-i18n="wallModeList"></button>
            <button class="mode-btn" data-mode="bubble" onclick="switchWallMode('bubble')" data-i18n="wallModeBubble"></button>
        </div>

        <div class="input-row">
            <input type="text" id="complaintInput" data-i18n-ph="wallPlaceholder" maxlength="40">
            <button class="send-btn" data-i18n="wallSend" onclick="submitComplaint()"></button>
        </div>

        <div id="wallView"></div>
        <div id="bubbleView" class="hidden"></div>

        <button class="btn ghost" data-i18n="wallBack" onclick="playClickSound(); closeWall()"></button>
    </div>

    <div id="health-screen" class="card hidden">
        <h2 data-i18n="hcTitle"></h2>
        <p data-i18n="hcSub"></p>

        <div class="sheet">
            <h3 data-i18n="hcSheet1"></h3>
            <div id="refactorRows"></div>
        </div>

        <div class="sheet">
            <h3 data-i18n="hcSheet2"></h3>
            <div id="compatRows"></div>
            <button class="btn" data-i18n="hcSoundBtn" onclick="testSound()"></button>
            <div class="pulse-status" id="audioStatus"></div>
        </div>

// ================= 院內大櫃子：全站唯一一份公式與音效引擎 =================
const Clinic = (() => {
    const math = {
        // 全站唯一一份「換算百分比」公式
        toPercent(value, min, max) {
            if (max === min) return 50;
            const ratio = (value - min) / (max - min);
            return Math.max(0, Math.min(100, Math.round(ratio * 100)));
        }
    };

    const sound = {
        ctx: null,
        ensure() {
            const AC = window.AudioContext || window.webkitAudioContext;
            if (!AC) return null;
            if (!this.ctx) this.ctx = new AC();
            if (this.ctx.state === "suspended") this.ctx.resume();
            return this.ctx;
        },
        // 喚醒音訊環境，回傳 Promise<boolean>
        unlock() {
            const c = this.ensure();
            if (!c) return Promise.resolve(false);
            if (c.state === "running") return Promise.resolve(true);
            return c.resume().then(() => c.state === "running").catch(() => false);
        },
        tone({ type, startFreq, endFreq, duration, volume }) {
            try {
                const c = this.ensure();
                if (!c) return;
                const tm = c.currentTime;
                const osc = c.createOscillator();
                const gain = c.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(startFreq, tm);
                osc.frequency.exponentialRampToValueAtTime(endFreq, tm + duration);
                gain.gain.setValueAtTime(volume, tm);
                gain.gain.exponentialRampToValueAtTime(0.001, tm + duration);
                osc.connect(gain);
                gain.connect(c.destination);
                osc.start(tm);
                osc.stop(tm + duration);
            } catch (e) {}
        }
    };

    return { math, sound };
})();

    let ms;
    if (anim && anim.currentTime != null) ms = Number(anim.currentTime);
    else ms = performance.now() - breatheStart;           // 備援：不支援或已關閉動畫時，退回自己計時
    return (ms % 4000) < 2000 ? "in" : "out";             // 前 2 秒放大 = 吸氣，後 2 秒縮小 = 吐氣

function sumScores(scores) {
    return Object.values(scores).reduce((a, b) => a + b, 0);
}
function addScores(scores) {
    for (let dim in scores) userScores[dim] += scores[dim];

function handleDraw(options) {

    setTimeout(() => { handleSelectOption(randomOption.scores); }, 2000);

function handleSelectOption(scores) {

    if (currentQuestionIndex < quizData.length - 1) {
        currentQuestionIndex++;

        showResult();
    }
}

function getQuestionRanges() {
    return quizData.map(q => {
        const totals = q.options.map(opt => sumScores(opt.scores));
        return { min: Math.min(...totals), max: Math.max(...totals) };
    });
}
// 耗損率與歸一化都走同一條 Clinic.math.toPercent
function calcDrain(total, min, max) {
    return 100 - Clinic.math.toPercent(total, min, max);
}
function getStatus(drain) {
    if (drain <= 30) return t('statusGood');
    if (drain <= 60) return t('statusMid');
    if (drain <= 85) return t('statusLow');
    return t('statusCritical');
}
function countUp(target) {
    const el = $("score-display");
    const start = performance.now();
    const duration = reduceMotion ? 1 : 1000;
    function step(now) {
        const tt = Math.min((now - start) / duration, 1);
        const eased = 1 - Math.pow(1 - tt, 3);
        el.innerText = Math.round(target * eased) + "%";
        if (tt < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
}

function getDimensionRange(dimension) {
    let min = 0, max = 0;
    quizData.forEach(q => {
        const contributions = q.options.map(opt => opt.scores[dimension] || 0);
        min += Math.min(...contributions);
        max += Math.max(...contributions);
    });
    return { min, max };
}
function normalize(score, min, max) {
    return Clinic.math.toPercent(score, min, max);
}
function renderDimensions(animate) {
    const container = $("dim-container");
    const calcLines = [];
    const frag = document.createDocumentFragment();
    const rows = [];

    dimensions.forEach(dim => {
        const { min, max } = getDimensionRange(dim);
        const raw = userScores[dim];
        const normalized = normalize(raw, min, max);
        const name = dimLabel(dim);

        const row = document.createElement("div");
        row.className = "dim-row";
        row.innerHTML = `
            <div class="dim-head">
                <span>${name} <span class="raw">${t('dimRaw', { raw, min, max })}</span></span>
                <span class="score">${normalized}</span>
            </div>
            <div class="dim-track">
                <div class="dim-fill" style="width:${animate ? 0 : normalized}%"></div>
            </div>
        `;
        frag.appendChild(row);
        rows.push({ row, normalized });

        calcLines.push(
            `<div class="row"><span>${name}：(${raw} − ${min}) ÷ ${max - min}</span><span>${t('dimScoreUnit', { v: normalized })}</span></div>`
        );
    });

    container.innerHTML = "";
    container.appendChild(frag);

    if (animate) {
        setTimeout(() => {
            rows.forEach(r => { r.row.querySelector(".dim-fill").style.width = r.normalized + "%"; });
        }, 50);
    }

    $("dim-calc").innerHTML =
        `<div style="font-weight:bold;margin-bottom:6px;">${t('calcTitle')}</div>` + calcLines.join("");
}

function showResultMessage() {
    // 用歸一化後的分數找最強、最弱維度，比原始分數公平
    const scored = dimensions.map(dim => {
        const { min, max } = getDimensionRange(dim);
        return [dim, normalize(userScores[dim], min, max)];
    });
    const top = scored.reduce((m, c) => c[1] > m[1] ? c : m);
    const low = scored.reduce((m, c) => c[1] < m[1] ? c : m);

    const ranges = getQuestionRanges();
    const min = ranges.reduce((s, r) => s + r.min, 0);
    const max = ranges.reduce((s, r) => s + r.max, 0);
    const total = answerLog.reduce((s, n) => s + n, 0);
    const drain = calcDrain(total, min, max);

    lastResult = { top, low, drain, total, min, max, ranges, answers: answerLog.slice() };

    renderResultTexts(true);

    const fill = $('fill');
    fill.style.width = '0%';

        fill.style.width = (100 - drain) + '%';

function getRadarColors() {
    return {
        outer: isDark ? '#67e8f9' : '#1e88e5',
        grid: isDark ? '#374151' : '#c5d8ea',
        fill: isDark ? 'rgba(103, 232, 249, 0.25)' : 'rgba(30, 136, 229, 0.22)',
        point: isDark ? '#67e8f9' : '#1e88e5',
        label: isDark ? '#ffffff' : '#263238'
    };
}

function drawRadarChart(scores, progress = 1) {
    const canvas = $('radarChart');
    const ctx = canvas.getContext('2d');
    const colors = getRadarColors();
    const dims = Object.keys(scores);
    const values = Object.values(scores);
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = 200;
    const maxScore = 10;
    const total = dims.length;
    const ang = i => -Math.PI / 2 + (Math.PI * 2 * i) / total;

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.lineWidth = 1;

    ctx.beginPath();
    for (let i = 0; i < total; i++) {
        const x = centerX + Math.cos(ang(i)) * radius;
        const y = centerY + Math.sin(ang(i)) * radius;
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = colors.outer;
    ctx.stroke();

    for (let i = 0; i < total; i++) {
        ctx.beginPath();
        ctx.moveTo(centerX, centerY);
        ctx.lineTo(centerX + Math.cos(ang(i)) * radius, centerY + Math.sin(ang(i)) * radius);
        ctx.strokeStyle = colors.grid;
        ctx.stroke();
    }

    const levels = 5;
    for (let level = 1; level <= levels; level++) {
        const levelRadius = radius * level / levels;
        ctx.beginPath();
        for (let i = 0; i < total; i++) {
            const x = centerX + Math.cos(ang(i)) * levelRadius;
            const y = centerY + Math.sin(ang(i)) * levelRadius;
            if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
        }
        ctx.closePath();
        ctx.strokeStyle = colors.grid;
        ctx.stroke();
    }

    const pointAt = (value, i) => {
        const clamped = Math.max(-maxScore, Math.min(maxScore, value));
        const r = radius * (Math.max(clamped, 0) * progress) / maxScore;
        return [centerX + Math.cos(ang(i)) * r, centerY + Math.sin(ang(i)) * r];
    };

    ctx.beginPath();
    values.forEach((value, i) => {
        const [x, y] = pointAt(value, i);
        if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.closePath();
    ctx.fillStyle = colors.fill;
    ctx.fill();
    ctx.strokeStyle = colors.outer;
    ctx.lineWidth = 3;
    ctx.stroke();

    values.forEach((value, i) => {
        const [x, y] = pointAt(value, i);
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fillStyle = colors.point;
        ctx.fill();
    });

    ctx.font = '16px "Microsoft JhengHei", sans-serif';
    ctx.fillStyle = colors.label;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    dims.forEach((dimension, i) => {
        const labelRadius = radius + 35;
        ctx.fillText(`${dimLabel(dimension)} ${scores[dimension]}`,
            centerX + Math.cos(ang(i)) * labelRadius,
            centerY + Math.sin(ang(i)) * labelRadius);
    });

    ctx.beginPath();
    ctx.arc(centerX, centerY, 4, 0, Math.PI * 2);
    ctx.fillStyle = colors.outer;
    ctx.fill();
}

function loadHistory() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : [];
    } catch (e) {
        return [];
    }
}
function saveRecord(weakest, drain) {
    const record = {
        time: new Date().toLocaleString("zh-TW", { hour12: false }),
        scores: { ...userScores },
        weakest: weakest,
        drain: drain
    };
    const history = loadHistory();
    history.unshift(record);
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(history.slice(0, MAX_RECORDS)));
    } catch (e) {}
}
function clearHistory() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
    renderHistory();
}
function renderHistory() {
    const list = $("history-list");
    if (!list) return;
    const history = loadHistory();
    list.innerHTML = "";
    const frag = document.createDocumentFragment();
    if (history.length === 0) {
        const li = document.createElement("li");
        li.className = "empty";
        li.textContent = t('historyEmpty');
        frag.appendChild(li);
    } else {
        history.forEach(rec => {
            const drainText = typeof rec.drain === "number" ? rec.drain + "%" : "—";
            const li = document.createElement("li");
            li.innerHTML = `
                <div class="time">🕒 ${rec.time}</div>
                <div>${t('histDrain')}：<span class="drain">${drainText}</span>　${t('histWeak')}：${dimLabel(rec.weakest)}</div>`;
            frag.appendChild(li);
        });
    }
    list.appendChild(frag);
}

// ---------- 惡言消滅器 ----------
function destroyTarget(element) {
    playPopSound();
    element.style.transform = "scale(1.5)";
    element.style.opacity = "0";
    setTimeout(() => { element.remove(); }, 200);
}
function spawnRageTarget() {
    const word = tr(rageWords[Math.floor(Math.random() * rageWords.length)]);   // 產生的當下取目前語言
    const randomLeft = Math.floor(Math.random() * 70) + 10;
    const el = document.createElement('div');
    el.className = 'rage-target';
    el.textContent = "🔥 " + word;
    el.style.left = `${randomLeft}%`;
    el.onclick = function() { destroyTarget(this); };
    document.body.appendChild(el);
    setTimeout(() => { if (document.body.contains(el)) el.remove(); }, 8000);
}
function startRageSpawner() {
    if (reduceMotion) return;
    if (!rageInterval) rageInterval = setInterval(spawnRageTarget, 2000);
}
function stopRageSpawner() {
    if (rageInterval) { clearInterval(rageInterval); rageInterval = null; }
    document.querySelectorAll('.rage-target').forEach(el => el.remove());
}

// ---------- 即時心電圖 ----------
const beatPattern = [
    { x: 0,  y: 0 },
    { x: 10, y: 0 },
    { x: 12, y: -5 },
    { x: 14, y: 40 },
    { x: 16, y: -20 },
    { x: 18, y: 0 },
    { x: 22, y: -8 },
    { x: 26, y: 0 },
    { x: 40, y: 0 }
];
const beatWidth = 40;
let ecgOffset = 0;
let ecgAnimId = null;

function getQuizProgress() {
    return Clinic.math.toPercent(currentQuestionIndex, 0, quizData.length) / 100;
}
function getEcgSpeed() { return 2 + getQuizProgress() * 6; }
function getEcgAmplitude() { return 1 + getQuizProgress() * 1.5; }

function sampleBeat(x) {
    const localX = x % beatWidth;
    for (let i = 0; i < beatPattern.length - 1; i++) {
        const a = beatPattern[i];
        const b = beatPattern[i + 1];
        if (localX >= a.x && localX <= b.x) {
            const tt = (localX - a.x) / (b.x - a.x || 1);
            return a.y + (b.y - a.y) * tt;
        }
    }
    return 0;
}

function drawECG() {
    const canvas = $('ecg');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    ctx.strokeStyle = "rgba(74, 222, 128, 0.08)";
    for (let gx = 0; gx < canvas.width; gx += 20) {
        ctx.beginPath();
        ctx.moveTo(gx, 0);
        ctx.lineTo(gx, canvas.height);
        ctx.stroke();
    }

    const midY = canvas.height / 2;
    const amplitude = getEcgAmplitude();

    ctx.beginPath();
    ctx.strokeStyle = "#4ade80";
    ctx.lineWidth = 2;
    ctx.shadowColor = "#4ade80";
    ctx.shadowBlur = 6;

    for (let x = 0; x < canvas.width; x++) {
        const sampleX = x + ecgOffset;
        const y = midY - sampleBeat(sampleX) * amplitude;
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.shadowBlur = 0;

    if (!reduceMotion) {
        ecgOffset += getEcgSpeed();
        ecgAnimId = requestAnimationFrame(drawECG);
    }
}

function startECG() {
    if (ecgAnimId) cancelAnimationFrame(ecgAnimId);
    ecgOffset = 0;
    drawECG();
    updateBpmDisplay();
}
function resumeECG() {
    if (!ecgAnimId) drawECG();
}
function stopECG() {
    if (ecgAnimId) { cancelAnimationFrame(ecgAnimId); ecgAnimId = null; }
}
function updateBpmDisplay() {
    const bpmEl = $('bpm-display');
    if (bpmEl) bpmEl.innerText = `${Math.round(60 + getQuizProgress() * 60)} bpm`;
}

// ---------- 匿名發洩牆：資料只存一份，畫面分兩種模式詮釋 ----------
// 預設三句有四語版本（物件），使用者自己輸入的就是單純的字串
let complaints = [
    L("教授說報告延期，結果延到明天早上八點", "The professor said the report was postponed, to 8 a.m. tomorrow", "先生がレポート延期と言ったのに、延びたのは明日の朝8時まで", "교수님이 보고서를 연기해 주셨는데 내일 아침 8시로 연기됐다"),
    L("咖啡喝到第三杯，手已經開始抖了", "Three coffees in and my hands are already shaking", "コーヒー3杯目で、もう手が震えてきた", "커피 세 잔째인데 벌써 손이 떨린다"),
    L("同組的人已經三天沒讀訊息了", "My groupmate hasn't read a message in three days", "グループの人が3日間メッセージを既読にしていない", "조원이 사흘째 메시지를 읽지 않고 있다")
];
let wallMode = "list";
let bubbleTimer = null;
let wallReturnScreen = "welcome-screen";

const complaintText = (item) => typeof item === "string" ? item : tr(item);

function openWall(from) {
    wallReturnScreen = from || "welcome-screen";
    showScreen('wall-screen');
}
function closeWall() {
    showScreen(wallReturnScreen);
}

function submitComplaint() {
    const input = $("complaintInput");
    const text = input.value.trim();
    if (!text) return;

    complaints.unshift(text);
    input.value = "";
    playPopSound();

    if (wallMode === "list") renderWallList();
    else spawnBubble(text);
}

$("complaintInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter") submitComplaint();
});

function switchWallMode(mode) {
    playClickSound();
    wallMode = mode;
    document.querySelectorAll(".mode-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.mode === mode);
    });
    renderWall();
}

function renderWall() {
    stopBubbles();
    $("wallView").classList.toggle("hidden", wallMode !== "list");
    $("bubbleView").classList.toggle("hidden", wallMode !== "bubble");
    if (wallMode === "list") renderWallList();
    else startBubbles();
}

// 條列牆模式：用 textContent 塞入文字，避免使用者輸入被當成 HTML 執行
function renderWallList() {
    const wall = $("wallView");
    wall.innerHTML = "";
    const frag = document.createDocumentFragment();
    if (complaints.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = t('wallEmpty');
        frag.appendChild(empty);
    } else {
        complaints.forEach(item => {
            const card = document.createElement("div");
            card.className = "complaint-card";
            card.textContent = "💬 " + complaintText(item);
            frag.appendChild(card);
        });
    }
    wall.appendChild(frag);
}

// 氣泡漂浮模式：定時從陣列隨機抓一句飄上去
function startBubbles() {
    stopBubbles();
    if (complaints.length === 0) return;
    spawnBubble();
    bubbleTimer = setInterval(() => spawnBubble(), 1800);
}
function stopBubbles() {
    if (bubbleTimer) { clearInterval(bubbleTimer); bubbleTimer = null; }
    const view = $("bubbleView");
    if (view) view.innerHTML = "";
}
function spawnBubble(specificText) {
    if (complaints.length === 0) return;
    const item = specificText || complaints[Math.floor(Math.random() * complaints.length)];
    const view = $("bubbleView");

    const el = document.createElement("div");
    el.className = "bubble";
    el.textContent = complaintText(item);
    el.style.left = (Math.random() * 60 + 5) + "%";
    el.style.animationDuration = (Math.random() * 2 + 5) + "s";

    view.appendChild(el);
    setTimeout(() => el.remove(), 7500);
}

// ---------- 出院通知書：同一份診斷，四種語氣 ----------
let lastSharedPlatform = null;
let shareToastTimer = null;

const shareKeyMap = { ig: "shareIg", threads: "shareThreads", line: "shareLine", fb: "shareFb" };

function buildShareText(platform) {
    const { low, drain } = lastResult;
    return t(shareKeyMap[platform], {
        drain: drain,
        remain: 100 - drain,
        weak: dimLabel(low[0]),
        advice: tr(prescriptionDB[low[0]])
    });
}

// 各平台能不能真的「預填文字」直接開啟分享視窗，各自規則不一樣
const platformLinks = {
    // LINE 的網址格式支援把文字塞進訊息欄
    line: (text) => `https://line.me/R/msg/text/?${encodeURIComponent(text)}`,
    // FB 的分享對話框只吃網址，自訂文字早被官方拔掉，開啟後仍要自己貼
    fb: () => `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(location.href)}`
    // IG、Threads 沒有網頁版預填管道，只能複製文字後請使用者自己貼
};

async function share(platform) {
    playClickSound();
    if (!lastResult) { showShareToast(t('shareNeedResult')); return; }

    const text = buildShareText(platform);
    lastSharedPlatform = platform;
    $("share-preview").innerText = text;

    // 先同步開視窗，避免被瀏覽器當成非使用者操作而攔截
    if (platformLinks[platform]) {
        window.open(platformLinks[platform](text), "_blank", "noopener");
    }

    const copied = await copyToClipboard(text);
    if (!copied) showShareToast(t('shareFail'));
    else if (platform === "ig") showShareToast(t('shareCopiedIg'));
    else if (platform === "threads") showShareToast(t('shareCopiedThreads'));
    else showShareToast(t('shareCopied'));
}

function refreshSharePreview() {
    const box = $("share-preview");
    if (!box) return;
    if (lastResult && lastSharedPlatform) box.innerText = buildShareText(lastSharedPlatform);
    else box.innerText = t('sharePreviewEmpty');
}

async function copyToClipboard(text) {
    try {
        await navigator.clipboard.writeText(text);
        return true;
    } catch (e) {
        // 舊瀏覽器或權限被擋時，退回 execCommand
        try {
            const textarea = document.createElement("textarea");
            textarea.value = text;
            textarea.style.position = "fixed";
            textarea.style.opacity = "0";
            document.body.appendChild(textarea);
            textarea.select();
            const ok = document.execCommand("copy");
            document.body.removeChild(textarea);
            return !!ok;
        } catch (e2) {
            return false;
        }
    }
}

function showShareToast(msg) {
    const toast = $("share-toast");
    toast.innerText = msg;
    clearTimeout(shareToastTimer);
    shareToastTimer = setTimeout(() => { toast.innerText = ""; }, 3000);
}

// ---------- 院內自主健檢 ----------
function openHealth() { showScreen('health-screen'); }
function closeHealth() { showScreen('welcome-screen'); }

// 檢驗單一：三個原本各寫各的地方，現在全部呼叫同一個函式
function renderRefactorRows() {
    const drain = 100 - Clinic.math.toPercent(14, -5, 24);
    const mindset = Clinic.math.toPercent(2, -10, 5);
    const amplitude = Clinic.math.toPercent(3, 0, 5);
    $("refactorRows").innerHTML = `
        <div class="hc-row"><span>${t('hcR1')}</span><b>${drain}%</b></div>
        <div class="hc-row"><span>${t('hcR2')}</span><b>${t('dimScoreUnit', { v: mindset })}</b></div>
        <div class="hc-row"><span>${t('hcR3')}</span><b>${amplitude}%</b></div>`;
}

// 檢驗單二：功能偵測，直接問瀏覽器有沒有，不靠猜裝置型號
const checks = [
    { name: "Touch",                       test: () => "ontouchstart" in window || navigator.maxTouchPoints > 0 },
    { name: "Pointer Events",              test: () => "PointerEvent" in window },
    { name: "Web Audio",                   test: () => !!(window.AudioContext || window.webkitAudioContext) },
    { name: "Clipboard API",               test: () => !!(navigator.clipboard && navigator.clipboard.writeText) },
    { name: "Secure context (https / localhost)", test: () => window.isSecureContext },
    { name: "localStorage",                test: () => {
        try { localStorage.setItem("__t", "1"); localStorage.removeItem("__t"); return true; }
        catch (e) { return false; }
    }},
    { name: "dvh",                         test: () => !!(window.CSS && CSS.supports && CSS.supports("height", "100dvh")) }
];
function renderCompat() {
    const frag = document.createDocumentFragment();
    checks.forEach(c => {
        let ok = false;
        try { ok = !!c.test(); } catch (e) {}
        const row = document.createElement("div");
        row.className = "hc-row";
        const name = document.createElement("span");
        name.textContent = c.name;
        const result = document.createElement("span");
        result.className = ok ? "ok" : "bad";
        result.textContent = ok ? t('hcOk') : t('hcNo');
        row.appendChild(name);
        row.appendChild(result);
        frag.appendChild(row);
    });
    const box = $("compatRows");
    box.innerHTML = "";
    box.appendChild(frag);
}
function renderAudioStatus() {
    const el = $("audioStatus");
    if (el) el.innerText = audioUnlocked ? t('hcAudioOk') : t('hcAudioWait');
}
function testSound() {
    Clinic.sound.unlock().then(() => playClickSound());
}

// 檢驗單三：效能。逐筆寫入 vs 批次寫入
const BENCH_COUNT = 2000;
let lastBench = null;

// 壞習慣：每放一個就讀一次版面，逼瀏覽器每一圈都重算
function renderNaive(n) {
    const box = $("benchBox");
    box.innerHTML = "";
    const t0 = performance.now();
    for (let i = 0; i < n; i++) {
        const el = document.createElement("div");
        el.className = "dot";
        box.appendChild(el);
        el.offsetHeight;
    }
    return performance.now() - t0;
}
// 好習慣：先在暫存盤排好，最後一次端上桌，版面只算一次
function renderBatch(n) {
    const box = $("benchBox");
    box.innerHTML = "";
    const t0 = performance.now();
    const frag = document.createDocumentFragment();
    for (let i = 0; i < n; i++) {
        const el = document.createElement("div");
        el.className = "dot";
        frag.appendChild(el);
    }
    box.appendChild(frag);
    box.offsetHeight;
    return performance.now() - t0;
}
function runBenchmark() {
    // 先暖機，避免第一次執行比較慢影響比較
    renderNaive(200);
    renderBatch(200);
    const naive = renderNaive(BENCH_COUNT);
    const batch = renderBatch(BENCH_COUNT);
    lastBench = { naive, batch };
    renderBenchRows();
}
function renderBenchRows() {
    if (!lastBench) { $("benchRows").innerHTML = ""; return; }
    const { naive, batch } = lastBench;
    const times = naive / Math.max(batch, 0.01);
    $("benchRows").innerHTML = `
        <div class="hc-row"><span>${t('hcNaive')}</span><b>${naive.toFixed(1)} ms</b></div>
        <div class="hc-row"><span>${t('hcBatch')}</span><b>${batch.toFixed(1)} ms</b></div>
        <div class="hc-row"><span>${t('hcDiff')}</span><b>${t('hcDiffVal', { x: times.toFixed(1) })}</b></div>`;
}

// 背景分頁暫停動畫：頁面被藏起來就停，回來再繼續
let pulseRaf = null;
let pulseX = -100;
function pulseLoop() {
    pulseX += 1.5;
    if (pulseX > 340) pulseX = -100;
    $("pulseBar").style.transform = `translateX(${pulseX}%)`;
    pulseRaf = requestAnimationFrame(pulseLoop);
}
function startPulse() {
    if (reduceMotion) { $("pulseStatus").innerText = t('hcPulseReduced'); return; }
    if (!pulseRaf) pulseRaf = requestAnimationFrame(pulseLoop);
    $("pulseStatus").innerText = t('hcPulseRun');
}
function stopPulse() {
    if (pulseRaf) cancelAnimationFrame(pulseRaf);
    pulseRaf = null;
}

function renderHealth() {
    renderRefactorRows();
    renderCompat();
    renderAudioStatus();
    renderBenchRows();
    if (reduceMotion) $("pulseStatus").innerText = t('hcPulseReduced');
    else if (pulseRaf) $("pulseStatus").innerText = t('hcPulseRun');
}

// 整站的背景分頁處理：頁面被藏起來就把所有迴圈停掉，回來再依畫面恢復
document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
        stopECG();
        stopRageSpawner();
        stopBubbles();
        stopPulse();
    } else {
        if (currentScreen === "quiz-screen") { startRageSpawner(); resumeECG(); }
        else if (currentScreen === "wall-screen" && wallMode === "bubble") startBubbles();
        else if (currentScreen === "health-screen") startPulse();
    }
});

window.onload = () => {
    applyTheme();
    applyLanguage("zh");
    renderHistory();
    $("share-preview").innerText = t('sharePreviewEmpty');
};
